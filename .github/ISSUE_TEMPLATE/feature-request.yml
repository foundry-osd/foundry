name: Feature request
description: Suggest an improvement to Foundry
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Keep the request focused on one problem or workflow.
        Remove sensitive information from screenshots and files.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Foundry OSD
        - Foundry Connect
        - Foundry Deploy
        - Documentation
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: Describe the limitation or difficulty.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would you like to change?
      placeholder: Describe the desired improvement.
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or attachments
      description: Optional. Add examples, mockups, screenshots, or other useful context.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing request before submitting this issue.
          required: true
