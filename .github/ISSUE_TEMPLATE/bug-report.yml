name: Bug report
description: Report a problem in Foundry
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before submitting a report.
        Do not report security vulnerabilities here. Use [private vulnerability reporting](https://github.com/foundry-osd/foundry/security/advisories/new).
        Remove sensitive information from logs, screenshots, and files.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Foundry OSD
        - Foundry Connect
        - Foundry Deploy
        - Documentation
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: What happened?
      placeholder: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect?
      placeholder: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: Add steps, frequency, or trigger conditions. Say if the issue is intermittent.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Foundry version
      placeholder: v26.8.10.1
    validations:
      required: true
  - type: dropdown
    id: latest-release
    attributes:
      label: Does it happen on the latest release?
      options:
        - "Yes"
        - "No"
        - Not tested
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Additional context or attachments
      description: Optional. Add relevant Windows, architecture, or device details; paste a sanitized log; or drag and drop supporting files.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue before submitting this report.
          required: true
