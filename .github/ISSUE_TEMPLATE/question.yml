name: Question
description: Ask for help with Foundry
labels:
  - question
body:
  - type: markdown
    attributes:
      value: |
        Use this form for usage, setup, deployment, or contribution questions.
        Remove sensitive information from logs, screenshots, and files.
  - type: dropdown
    id: kind
    attributes:
      label: Question type
      options:
        - Usage or setup
        - Deployment workflow
        - Build or contribution
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: What do you need help with?
      placeholder: Explain what you are trying to do and where you are blocked.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Include the Foundry version and what you already tried when relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Logs or attachments
      description: Optional. Paste a short sanitized log or drag and drop screenshots, recordings, logs, or files.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and documentation before submitting this question.
          required: true
