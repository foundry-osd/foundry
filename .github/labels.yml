# Repository Labels Configuration
# This file defines all labels used in the repository.
# Run the sync-labels workflow to create or update these labels.

# Type labels

- name: bug
  color: 'd73a4a'
  description: Bug fix or regression correction

- name: feature
  color: 'a2eeef'
  description: New behavior or capability

- name: documentation
  color: '0075ca'
  description: Documentation updates

- name: breaking-change
  color: '7f1d1d'
  description: Introduces a breaking change

- name: security
  color: 'c026d3'
  description: Security-related change or report

- name: chore
  color: 'fbca04'
  description: Maintenance or routine repository work

- name: refactor
  color: 'c2e0c6'
  description: Internal code change without intended behavior changes

- name: dependencies
  color: 'fbcfe8'
  description: Dependency, package, or project metadata change

- name: tests
  color: '9db4ff'
  description: Test coverage or test infrastructure change

# Project labels

- name: 'project: foundry'
  color: '06b6d4'
  description: Changes in the Foundry desktop application

- name: 'project: foundry-core'
  color: '0a3069'
  description: Changes in the Foundry.Core shared business logic library

- name: 'project: shared'
  color: 'b08800'
  description: Changes in shared localization, telemetry, or utility libraries

- name: 'project: foundry-deploy'
  color: '0e8a16'
  description: Changes in the Foundry.Deploy deployment application

- name: 'project: foundry-connect'
  color: 'ea580c'
  description: Changes in the Foundry.Connect WinPE network provisioning application

- name: 'project: foundry-bootstrap'
  color: '84cc16'
  description: Changes in the Foundry.Bootstrap WinPE boot orchestration runtime

- name: 'project: foundry-postinstall'
  color: '8d5524'
  description: Changes in the Foundry.PostInstall post-installation runtime

- name: ui
  color: 'db2777'
  description: User interface or XAML changes

- name: ci
  color: 'f9d0c4'
  description: CI, automation, or workflow changes

- name: config
  color: 'fef2c0'
  description: Repository or build configuration changes

# Collaboration labels

- name: help wanted
  color: '008672'
  description: Maintainers would welcome an external contribution

- name: good first issue
  color: '7057ff'
  description: Suitable for a first contribution

- name: question
  color: 'd876e3'
  description: Usage, setup, or contribution question

- name: blocked
  color: '24292f'
  description: Blocked by another task or external dependency

- name: 'status: waiting-for-user'
  color: 'fb8c00'
  description: Waiting for user feedback or requested information

# Resolution labels

- name: duplicate
  color: 'cfd3d7'
  description: Already tracked elsewhere

- name: invalid
  color: 'e4e669'
  description: Not actionable as submitted

- name: wontfix
  color: '57606a'
  description: Intentionally not planned

- name: stale
  color: '8b949e'
  description: No recent activity

# Special labels

- name: pinned
  color: '6e7b1e'
  description: Exempt from stale handling
