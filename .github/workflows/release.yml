name: Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Create a release even without changes since the latest published release
        required: false
        default: false
        type: boolean
      draft:
        description: Keep the completely verified GitHub release as a draft
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare immutable release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      should_release: ${{ steps.compute.outputs.should_release }}
      release_sha: ${{ steps.compute.outputs.release_sha }}
      release_tag: ${{ steps.compute.outputs.release_tag }}
      release_version: ${{ steps.compute.outputs.release_version }}
      package_version: ${{ steps.compute.outputs.package_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Compute identity and notes without creating a release
        id: compute
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_RELEASE: ${{ inputs.force }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA) { throw 'Checkout SHA mismatch.' }
          git fetch --tags --force
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch tags.' }
          $json = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list releases.' }
          $releases = @(foreach ($page in ($json | ConvertFrom-Json)) { foreach ($release in $page) { $release } })
          $latest = $releases | Where-Object { -not $_.draft -and -not $_.prerelease } | Sort-Object published_at -Descending | Select-Object -First 1
          $changed = if ($null -eq $latest) { @(git ls-files src scripts .github) } else { @(git diff --name-only "$($latest.tag_name)..$sha" -- src scripts .github) }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to compare release source.' }
          $shouldRelease = $changed.Count -gt 0 -or $env:FORCE_RELEASE -eq 'true'
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "release_sha=$sha" >> $env:GITHUB_OUTPUT
          if (-not $shouldRelease) { Write-Host 'No release changes. Use force to build anyway.'; exit 0 }
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTimeOffset]::UtcNow, 'Europe/Paris')
          $prefix = 'v{0}.{1}.{2}' -f ($now.Year % 100), $now.Month, $now.Day
          $tags = @(git tag -l "$prefix.*")
          if ($LASTEXITCODE -ne 0) { throw 'Unable to list local tags.' }
          $builds = @(@($tags) + @($releases.tag_name) | ForEach-Object {
            if ($_ -match ('^' + [regex]::Escape($prefix) + '\.([1-9]\d*)$')) { [long]$Matches[1] }
          })
          $revision = if ($builds.Count) { ($builds | Measure-Object -Maximum).Maximum + 1 } else { 1 }
          $tag = "$prefix.$revision"
          $version = $tag.Substring(1)
          ./scripts/Set-FoundryBuildVersion.ps1 -Version $version
          $parts = $version.Split('.')
          $package = '{0}.{1}.{2}-build.{3}' -f $parts[0], $parts[1], $parts[2], $parts[3]
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "package_version=$package" >> $env:GITHUB_OUTPUT
          $metadata = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release-metadata'
          New-Item -ItemType Directory -Path $metadata | Out-Null
          $request = @{ tag_name = $tag; target_commitish = $sha }
          if ($null -ne $latest) { $request.previous_tag_name = $latest.tag_name }
          $requestPath = Join-Path $metadata 'notes-request.json'
          $request | ConvertTo-Json | Set-Content -LiteralPath $requestPath
          $notes = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" --method POST --input $requestPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to generate release notes.' }
          ($notes | ConvertFrom-Json).body | Set-Content -LiteralPath (Join-Path $metadata 'release-notes.md')
      - name: Retain release notes
        if: steps.compute.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: artifacts/release-metadata/release-notes.md
          if-no-files-found: error

  verify-source:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ needs.prepare-release.outputs.release_sha }}
      release_version: ${{ needs.prepare-release.outputs.release_version }}

  package:
    name: Package and validate (${{ matrix.runtime }})
    needs: [prepare-release, verify-source]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-latest
          - runtime: win-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: artifacts/release-metadata
      - name: Apply version, package and validate without starting application services
        shell: pwsh
        env:
          FoundryPostHogProjectToken: ${{ secrets.FoundryPostHogProjectToken }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RELEASE_RUNTIME: ${{ matrix.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FoundryPostHogProjectToken)) { throw 'Release telemetry project token is required.' }
          ./scripts/Set-FoundryBuildVersion.ps1 -Version $env:RELEASE_VERSION
          ./scripts/New-FoundryReleaseAssets.ps1 -RuntimeIdentifier $env:RELEASE_RUNTIME -SourceSha $env:RELEASE_SHA -ProductVersion $env:RELEASE_VERSION -PackageVersion $env:PACKAGE_VERSION -ReleaseNotesPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts/release-metadata/release-notes.md')
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidates-${{ matrix.runtime }}
          path: artifacts/release/${{ matrix.runtime }}/*
          if-no-files-found: error
          compression-level: 0

  verify-assets:
    name: Verify complete release inventory
    needs: [prepare-release, package]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-candidates-*
          path: artifacts/candidates
          merge-multiple: false
      - name: Validate receipts and merge matching bytes
        shell: pwsh
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(Get-ChildItem artifacts/candidates -Directory | Select-Object -ExpandProperty FullName)
          $verified = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verified-release'
          New-Item -ItemType Directory -Path $verified | Out-Null
          $manifestPath = Join-Path $verified 'release-assets.json'
          ./scripts/Test-FoundryReleaseAssets.ps1 -AssetRoots $roots -SourceSha $env:RELEASE_SHA -ProductVersion $env:RELEASE_VERSION -PackageVersion $env:PACKAGE_VERSION -OutputPath $manifestPath
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          foreach ($asset in $manifest.assets) {
            $source = @($roots | ForEach-Object { Join-Path $_ $asset.name } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })[0]
            Copy-Item -LiteralPath $source -Destination (Join-Path $verified $asset.name)
          }
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release
          path: artifacts/verified-release/*
          if-no-files-found: error
          compression-level: 0

  stage-release:
    name: Upload and verify draft assets
    needs: [prepare-release, verify-assets]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.stage.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: artifacts/verified-release
      - uses: actions/download-artifact@v8
        with:
          name: release-metadata
          path: artifacts/release-metadata
      - name: Stage one bound draft
        id: stage
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verified-release'
          $result = ./scripts/Publish-FoundryRelease.ps1 -Mode Stage -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -SourceSha $env:RELEASE_SHA -ProductVersion $env:RELEASE_VERSION -PackageVersion $env:PACKAGE_VERSION -ManifestPath (Join-Path $assets 'release-assets.json') -AssetsDirectory $assets -NotesFile (Join-Path $env:GITHUB_WORKSPACE 'artifacts/release-metadata/release-notes.md')
          "release_id=$($result.releaseId)" >> $env:GITHUB_OUTPUT

  publish-release:
    name: Recheck draft and apply requested publication state
    needs: [prepare-release, stage-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}
      - uses: actions/download-artifact@v8
        with:
          name: verified-release
          path: artifacts/verified-release
      - name: Recheck exact release and assets before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.release_version }}
          PACKAGE_VERSION: ${{ needs.prepare-release.outputs.package_version }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release_id }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:GITHUB_WORKSPACE 'artifacts/verified-release'
          ./scripts/Publish-FoundryRelease.ps1 -Mode Publish -Repository $env:GITHUB_REPOSITORY -Tag $env:RELEASE_TAG -SourceSha $env:RELEASE_SHA -ProductVersion $env:RELEASE_VERSION -PackageVersion $env:PACKAGE_VERSION -ManifestPath (Join-Path $assets 'release-assets.json') -AssetsDirectory $assets -ExpectedReleaseId ([long]$env:RELEASE_ID) -KeepDraft:($env:KEEP_DRAFT -eq 'true')
