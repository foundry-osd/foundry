name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Restore solution
        run: dotnet restore .\src\Foundry.slnx --nologo

      - name: Verify formatting
        run: .\scripts\Test-FoundryFormat.ps1

  build:
    name: Build (${{ matrix.platform }})
    needs: format
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            runner: windows-latest
          - platform: ARM64
            runner: windows-11-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-${{ hashFiles('src/**/*.csproj', 'src/Directory.Build.props', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-nuget-

      - name: Restore solution
        run: dotnet restore .\src\Foundry.slnx --nologo

      - name: Build solution
        run: dotnet build .\src\Foundry.slnx -c Release -p:Platform=${{ matrix.platform }} -p:ContinuousIntegrationBuild=true -warnaserror --no-restore --nologo

      - name: Smoke test Bootstrap package
        shell: pwsh
        run: |
          $runtimeIdentifier = if ('${{ matrix.platform }}' -eq 'x64') { 'win-x64' } else { 'win-arm64' }
          $publishPath = Join-Path $env:RUNNER_TEMP "Foundry.Bootstrap-$runtimeIdentifier"
          $archivePath = "$publishPath.zip"
          $extractPath = "$publishPath-extracted"

          dotnet publish .\src\Foundry.Bootstrap\Foundry.Bootstrap.csproj `
            -c Release `
            -r $runtimeIdentifier `
            --self-contained true `
            -o $publishPath `
            --nologo `
            -p:Platform=${{ matrix.platform }} `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:DebugType=None `
            -p:GenerateDocumentationFile=false

          if ($LASTEXITCODE -ne 0) {
            throw "Bootstrap publish failed for '$runtimeIdentifier'."
          }

          Compress-Archive -Path (Join-Path $publishPath '*') -DestinationPath $archivePath -CompressionLevel Optimal -Force
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $expectedExecutable = Join-Path $extractPath 'Foundry.Bootstrap.exe'
          if (-not (Test-Path -Path $expectedExecutable -PathType Leaf)) {
            throw "Bootstrap ZIP does not contain Foundry.Bootstrap.exe at its root."
          }

      - name: Run unit tests
        shell: pwsh
        run: |
          $testProjects = Get-ChildItem .\src -Directory -Filter *.Tests |
            ForEach-Object { Join-Path $_.FullName "$($_.Name).csproj" }

          foreach ($testProject in $testProjects) {
            dotnet run --project $testProject -c Release -p:Platform=${{ matrix.platform }} --no-build
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
