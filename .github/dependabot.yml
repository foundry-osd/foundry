version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependabot pull requests are not path-labeled by the Auto Labeler workflow (read-only token).
    labels:
      - "dependencies"
      - "ci"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
    groups:
      nuget-deps:
        patterns:
          - "*"
